# cargo-deny configuration.
#
# The previous version of this file could not be parsed at all. It used
# keys removed in cargo-deny v0.20 (`unlicensed`, `copyleft`,
# `allow-osi-fsf-free`, and the per-severity `[advisories]` levels), and
# a stray `[bans]` header on line 21 captured three `[licenses]` settings
# that follow it, leaving two conflicting `allow` keys. `cargo deny
# check` exited with a deserialize error, so this gate has been
# inoperative rather than passing.

[graph]
all-features = true

[advisories]
# Severity levels are no longer configured per class. Any RustSec
# advisory at or above the default threshold fails the build unless it
# is listed here, with a reason and a revisit condition.
yanked = "warn"
ignore = []

[licenses]
# Derived from the actual dependency graph under `--all-features`, not
# inherited from a sibling project. Every entry below is reachable
# today, which is what makes this list meaningful: anything new fails.
allow = [
    "MIT",
    "Apache-2.0",
    # `ring` and the `wasm-bindgen` line carry the LLVM exception.
    "Apache-2.0 WITH LLVM-exception",
    # `untrusted` / `rustls-webpki`.
    "ISC",
    # `memchr`, `byteorder`, `aho-corasick` are Unlicense OR MIT.
    "Unlicense",
    # Transitive BSD-licensed dependencies.
    "BSD-2-Clause",
    "BSD-3-Clause",
    # `adler2` and compression helpers.
    "0BSD",
    # `foldhash`, via hashbrown.
    "Zlib",
    # `tiny-keccak` and similar offer BSL-1.0 as an alternative arm.
    "BSL-1.0",
    # `notify`'s dependency chain.
    "CC0-1.0",
    # `icu_*` / `zerovec`, pulled in transitively by `idna`.
    "Unicode-3.0",
]
# One crate offers LGPL-2.1-or-later as a third alternative alongside
# MIT and Apache-2.0. The expression is a disjunction, so a permissive
# arm is taken and the copyleft option never applies -- but it is kept
# out of `allow` so that stays explicit.
confidence-threshold = 0.93

[bans]
# Duplicate versions are common and mostly benign in a build-tool
# dependency tree; warn rather than fail so the gate stays credible.
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
