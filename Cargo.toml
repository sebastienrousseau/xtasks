[package]
# Metadata about the package.
authors = ["The xtasks contributors"]
build = "build.rs"
categories = [
    "command-line-interface",
    "command-line-utilities",
    "compilers",
    "config",
    "development-tools",
]
description = """
Essential tools and tasks for Rust projects using the xtask pattern, simplifying
common build and development workflows.
"""
documentation = "https://docs.rs/xtasks"
edition = "2021"
exclude = ["/.git/*", "/.github/*", "/.gitignore", "/.vscode/*"]
homepage = "https://xtasks.pro"
keywords = ["xtasks"]
license = "MIT OR Apache-2.0"
name = "xtasks"
readme = "README.md"
repository = "https://github.com/sebastienrousseau/xtasks"
rust-version = "1.71.1"
version = "0.0.3"
include = [
    "/CONTRIBUTING.md",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
    "/benches/**",
    "/build.rs",
    "/Cargo.toml",
    "/examples/**",
    "/README.md",
    "/src/**",
    "/tests/**",
]


# [[bench]]
# [[bench]] sections define benchmarks.
# name = "benchmark"
# harness = false
# path = "benches/bench.rs"

# [profile.bench]
# Profile for benchmarks.
# debug = true

[lib]
# The crate type is a library.
crate-type = ["lib"]
name = "xtasks"
path = "src/lib.rs"

[[bin]]
# [[bin]] sections define binaries.
name = "xtasks"
path = "src/main.rs"

[features]
# No default features
cli = []
default = []

[package.metadata.docs.rs]
# Documentation settings.
targets = ["x86_64-unknown-linux-gnu"]
rustdoc-args = ["--generate-link-to-definition"]
all-features = true

[dependencies]
# Dependencies are only used for building.
anyhow = "1.0.86"
clap = { version = "4.5.4", optional = false }
derive_builder = "^0.20.0"
dialoguer = "0.11.0"
dtt = "0.0.6"
duct = "0.13.7"
env_logger = "0.11.3"
fs_extra = "1.3.0"
glob = "0.3.1"
log = "0.4.21"
rlg = "0.0.4"
serde = { version = "1.0.202", features = ["derive"] }
serde_json = "1.0.117"
simplelog = "0.12.2"
toml = "0.8.13"
vrd = "0.0.7"

[dev-dependencies]
# Dev dependencies are only used for building.
assert_cmd = "2.0.14"
criterion = "0.5.1"
tempfile = "3.10.1"

# Linting config
[lints.rust]

## Warn
# box_pointers = "warn"
missing_copy_implementations = "warn"
missing_docs = "warn"
# unstable_features = "warn"
# unused_crate_dependencies = "warn"
# unused_extern_crates = "warn"
# unused_results = "warn"

## Allow
bare_trait_objects = "allow"
elided_lifetimes_in_paths = "allow"
non_camel_case_types = "allow"
non_upper_case_globals = "allow"
trivial_bounds = "allow"
unsafe_code = "allow"

## Forbid
missing_debug_implementations = "forbid"
non_ascii_idents = "forbid"
unreachable_pub = "forbid"

## Deny
dead_code = "deny"
deprecated_in_future = "deny"
ellipsis_inclusive_range_patterns = "deny"
explicit_outlives_requirements = "deny"
future_incompatible = { level = "deny", priority = -1 }
keyword_idents = "deny"
macro_use_extern_crate = "deny"
meta_variable_misuse = "deny"
missing_fragment_specifier = "deny"
noop_method_call = "deny"
pointer_structural_match = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2021_compatibility = { level = "deny", priority = -1 }
single_use_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unused = { level = "deny", priority = -1 }
unused_features = "deny"
unused_import_braces = "deny"
unused_labels = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
unused_qualifications = "deny"
variant_size_differences = "deny"

[package.metadata.clippy]
warn-lints = [
    "clippy::all",
    "clippy::pedantic",
    "clippy::cargo",
    "clippy::nursery",
]

[profile.dev]
codegen-units = 256
debug = true
debug-assertions = true
incremental = true
lto = false
opt-level = 0
overflow-checks = true
panic = 'unwind'
rpath = false
strip = false

[profile.release]
codegen-units = 1
debug = false
debug-assertions = false
incremental = false
lto = true
opt-level = "s"
overflow-checks = false
panic = "abort"
rpath = false
strip = "symbols"

[profile.test]
codegen-units = 256
debug = true
debug-assertions = true
incremental = true
lto = false
opt-level = 0
overflow-checks = true
rpath = false
strip = false
