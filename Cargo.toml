[package]
authors = ["The xtasks contributors"]
build = "build.rs"
categories = [
    "command-line-interface",
    "command-line-utilities",
    "compilers",
    "config",
    "development-tools"
]
description = """
Essential tools and tasks for Rust projects using the xtask pattern, simplifying
common build and development workflows.
"""
documentation = "https://docs.rs/xtasks"
edition = "2021"
exclude = ["/.git/*", "/.github/*", "/.gitignore", "/.vscode/*"]
homepage = "https://xtasks.pro"
keywords = ["xtasks"]
license = "MIT OR Apache-2.0"
name = "xtasks"
readme = "README.md"
repository = "https://github.com/sebastienrousseau/xtasks"
rust-version = "1.71.1"
version = "0.0.2"
include = [
    "/CONTRIBUTING.md",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
    "/build.rs",
    "/Cargo.toml",
    "/README.md",
    "/src/**",
]

[[bench]]
name = "benchmarks"
harness = false

[lib]
crate-type = ["lib"]
name = "xtasks"
path = "src/lib.rs"

[[bin]]
name = "xtasks"
path = "src/main.rs" 

[features]
cli = []
default = []

[package.metadata.docs.rs]
all-features = true

[dependencies]
anyhow = "1.0.95"
clap = { version = "4.5.13", optional = false }
derive_builder = "^0.20.2"
dialoguer = "0.12.0"
dtt = "0.0.11"
duct = "1.1.1"
fs_extra = "1.3.0"
glob = "0.3.1"
rlg = "0.0.12"
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.108"
vrd = "0.0.12"
# Published on crates.io since 0.0.3. The previous git+tag pin
# resolved to the commit the v0.0.3 tag pointed at when the lockfile
# was written, and kept resolving there after the tag was retargeted
# -- so it silently tracked superseded code.
commons = { package = "euxis-commons", version = "0.0.4", default-features = false, features = ["error", "config"] }

[dev-dependencies]
assert_cmd = "2.0.14"
criterion = "0.8.2"
tempfile = "3.9.0"

# Linting config
[lints.rust]
missing_copy_implementations = "warn"
missing_docs = "warn"
unstable_features = "warn"
unused_extern_crates = "warn"
unused_results = "warn"

bare_trait_objects = "allow"
elided_lifetimes_in_paths = "allow"
non_camel_case_types = "allow"
non_upper_case_globals = "allow"
trivial_bounds = "allow"
unsafe_code = "allow"

missing_debug_implementations = "forbid"
non_ascii_idents = "forbid"
# "deny", not "forbid": the library surface is still strictly
# forbidden via `#![forbid(unreachable_pub)]` in src/lib.rs, but the
# examples need a scoped opt-out. examples/example.rs aggregates the
# other examples as modules and calls their `main`, so those must be
# `pub` — which the lint cannot see from an example binary root.
# "forbid" makes that #[allow] a hard error (E0453).
unreachable_pub = "deny"

dead_code = "deny"
deprecated_in_future = "deny"
ellipsis_inclusive_range_patterns = "deny"
explicit_outlives_requirements = "deny"
future_incompatible = { level = "deny", priority = -1 }
keyword_idents = { level = "deny", priority = -1 }
macro_use_extern_crate = "deny"
meta_variable_misuse = "deny"
noop_method_call = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2021_compatibility = { level = "deny", priority = -1 }
single_use_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unused = { level = "deny", priority = -1 }
unused_features = "deny"
unused_import_braces = "deny"
unused_labels = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
unused_qualifications = "deny"
variant_size_differences = "deny"

[package.metadata.clippy]
warn-lints = [
    "clippy::all",
    "clippy::pedantic",
    "clippy::cargo",
    "clippy::nursery",
]

[profile.dev]
codegen-units = 256
debug = true
debug-assertions = true
incremental = true
lto = false
opt-level = 0
overflow-checks = true
panic = 'unwind'
rpath = false
strip = false

[profile.release]
codegen-units = 1
debug = false
debug-assertions = false
incremental = false
lto = true
opt-level = "s"
overflow-checks = false
panic = "abort"
rpath = false
strip = "symbols"

[profile.test]
codegen-units = 256
debug = true
debug-assertions = true
incremental = true
lto = false
opt-level = 0
overflow-checks = true
rpath = false
strip = false